---
prepare-commit-msg:
  skip: [merge]
  commands:
    add-issue-id:
      run: bash -c "$DOTFILES/git-galaxy/scripts/prepare-commit-msg/add_issue_id.sh {0}"
    detect-conflict-markers:
      exclude:
        - "*.patch"
        - "*.sln"
      run: bash -c "git diff --staged --check {staged_files} > /dev/null"
      fail_text: Detected conflict markers, tabs, or trailing whitespace. Run `git diff --staged --check` and fix the issues.
