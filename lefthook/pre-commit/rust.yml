---
pre-commit:
  skip: [merge]
  parallel: false
  commands:
    rustfmt:
      glob: '*.rs'
      run: rustfmt --check --edition 2021 {staged_files} || (rustfmt --edition 2021 {staged_files} && false)
    clippy:
      glob: '*.rs'
      run: bash -c "$DOTFILES/git-galaxy/scripts/pre-commit/clippy.sh {staged_files}"
