---
pre-commit:
  skip: [merge]
  parallel: false
  commands:
    cmake-format:
      glob: '{CMakeLists.txt,*.cmake}'
      run: bash -c "$DOTFILES/git-galaxy/scripts/pre-commit/cmake-format.sh {staged_files}"
    cmake-lint:
      glob: '{CMakeLists.txt,*.cmake}'
      run: bash -c "$DOTFILES/git-galaxy/scripts/pre-commit/cmake-lint.sh {staged_files}"
